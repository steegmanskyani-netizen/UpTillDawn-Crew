name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Placeholder public values are sufficient for compile-time validation.
      # Real production values are configured separately in Cloudflare.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Regenerate cleanup lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload cleanup lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-package-lock
          path: package-lock.json
          retention-days: 1

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Cloudflare Worker
        run: npm run build:cloudflare

      - name: Wrangler deployment dry-run
        run: npx wrangler deploy --dry-run
