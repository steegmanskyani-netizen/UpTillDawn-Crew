name: Deploy Preview

on:
  workflow_dispatch:
  push:
    branches:
      - codex/uptilldawn-production-hardening

concurrency:
  group: uptilldawn-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate preview secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_APP_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing preview secret: $name"; exit 1; fi
          done
          case "$NEXT_PUBLIC_APP_URL" in https://*) ;; *) echo "::error::NEXT_PUBLIC_APP_URL must be HTTPS."; exit 1 ;; esac
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:cloudflare
      - run: npx wrangler deploy --dry-run --name uptilldawn-crew-preview
      - name: Deploy preview Worker
        run: npx wrangler deploy --name uptilldawn-crew-preview
